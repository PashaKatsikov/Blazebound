name: blazebound
description: "Fire Recall arena action. Throw blazing coins, recall them through the circus, and topple the Inferno Ringmaster."
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── Native game stack ──
  audioplayers: ^6.5.1
  shared_preferences: ^2.5.3
  wakelock_plus: ^1.3.3

  # ── Relay flow stack ──
  # ⚠️ Do NOT add file_picker >= 10.x (Kotlin-only KGP clash). The native
  # file chooser is bridged over a MethodChannel instead.
  webview_flutter: ^4.14.0
  webview_flutter_android: ^4.13.0
  connectivity_plus: ^7.1.1
  appsflyer_sdk: ^6.18.0
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.0
  firebase_app_check: ^0.4.5
  flutter_local_notifications: ^22.0.1
  flutter_secure_storage: ^10.3.1
  device_info_plus: 11.4.0
  http: ^1.6.0
  url_launcher: ^6.3.2
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/marquee_art/
    - assets/bigtop_sheets/
    - assets/calliope_sfx/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon_src/bb_launch_icon.png"
  adaptive_icon_background: "#12040A"
  adaptive_icon_foreground: "assets/icon_src/bb_launch_fg.png"
  # Generator only emits an integer percent. 12% is ~82dp; the adaptive
  # XML is then pinned to inset 13dp so the art is exactly 82dp of 108dp.
  adaptive_icon_foreground_inset: 12
  remove_alpha_ios: true
